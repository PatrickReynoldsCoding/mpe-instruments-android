name: ci
on:
  push:
  pull_request:

jobs:
  engine:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
        with: { submodules: recursive }
      - name: Install Faust and CMake
        run: sudo apt-get update && sudo apt-get install -y faust faust-common cmake g++
      - name: Build engine and run tests
        run: |
          cmake -S engine -B engine/build
          cmake --build engine/build -j"$(nproc)"
          cd engine/build && ctest --output-on-failure
      - name: Cost of 8 fingers (for the log)
        run: engine/build/tools/bench 8 96 2

  engine-sanitizers:
    runs-on: ubuntu-24.04
    strategy:
      matrix: { san: [address, undefined, thread] }
    steps:
      - uses: actions/checkout@v5
        with: { submodules: recursive }
      - run: sudo apt-get update && sudo apt-get install -y faust faust-common cmake g++
      - name: Build and test with ${{ matrix.san }} sanitizer
        run: |
          cmake -S engine -B engine/build -DMPE_SANITIZE=${{ matrix.san }}
          cmake --build engine/build -j"$(nproc)"
          cd engine/build && ctest --output-on-failure

  android:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
        with: { submodules: recursive }
      - uses: actions/setup-java@v5
        with: { distribution: temurin, java-version: 17 }
      - name: Install Faust (the build turns each .dsp into C++)
        run: sudo apt-get update && sudo apt-get install -y faust faust-common
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: "8.9" }
      - name: Build debug APK (uses the SDK already on the runner, ANDROID_HOME)
        run: gradle :app:assembleDebug --stacktrace
      - uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: app/build/outputs/apk/debug/app-debug.apk

  emulator:
    # End to end on an Android emulator: the fake Seaboard plays, the app records its own output.
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v5
        with: { submodules: recursive }
      - uses: actions/setup-java@v5
        with: { distribution: temurin, java-version: 17 }
      - name: Install Faust and numpy
        run: sudo apt-get update && sudo apt-get install -y faust faust-common python3-numpy
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: "8.9" }
      - name: Build app and fake Seaboard
        run: gradle assembleDebug
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Run end-to-end tests on the emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          emulator-options: -no-window -no-audio -no-boot-anim -no-snapshot -gpu swiftshader_indirect
          disable-animations: true
          script: python3 -I tools/emulator_test.py
